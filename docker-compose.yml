services:
  db:
    image: postgres:16-alpine
    container_name: order-by-sms-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order_by_sms
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_by_sms"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: order-by-sms-api
    restart: always
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/order_by_sms?schema=public
      SMSHUB_MODE: test
      SMSHUB_API_KEY: test_key_local_docker
      SESSION_SECRET: replace_with_at_least_32_random_characters_for_sessions
      PICKUP_CODE_SECRET: replace_with_at_least_32_random_characters_for_pickup_hash
      FRONTEND_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: order-by-sms-web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_API_URL: http://api:4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/order_by_sms?schema=public
      SESSION_SECRET: replace_with_at_least_32_random_characters_for_sessions
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
